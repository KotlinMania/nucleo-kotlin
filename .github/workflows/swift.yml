name: Build (Swift)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Swift)
    # macos-latest currently resolves to macos-15 (Xcode 16 / macOS 15 SDK)
    # but the Kotlin/Native 2.3.x distribution's prebuilt platform caches
    # reference macOS 26 / iOS 26 SDK symbols (NSCalendarIdentifier{Vikram,
    # Bangla,...}, _NSURLUbiquitousItem*Key, _xpc_session_set_peer_requirement,
    # etc). Linking the swift-test harness on macos-15 therefore fails with
    # "Undefined symbols for architecture arm64" on every cache-referenced
    # symbol. Pin macos-26 so the SDK matches the platform-cache. The image
    # default Xcode (currently 26.4.1) is in the 26.x line and carries the
    # expected SDK stubs; per SWIFT_EXPORT_ROLLOUT.md gap #7 do NOT add a
    # maxim-lobanov/setup-xcode pin (third-party action, not on the
    # KotlinMania allowlist — causes startup_failure at dispatch).
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Print Swift / Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run Swift Export smoke test
        run: ./gradlew swiftExportTest --no-daemon --no-configuration-cache --console=plain

      - name: Upload Swift Export artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-export-artifacts
          path: |
            build/swift-test/libNucleo.a
            build/swift-test/*.swiftmodule/
            build/SPMPackage/macosArm64/Debug/
          retention-days: 7
          if-no-files-found: warn
